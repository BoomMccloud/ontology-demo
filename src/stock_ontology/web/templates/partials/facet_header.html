<section class="facet-card">
  <div class="entry-title-row">
    <h1 class="u-m-0 u-fs-1p55rem">
      {{ entity.name }}
      {% if entity.ticker %}
        <span class="mono">({{ entity.ticker }})</span>
      {% endif %}
    </h1>
    <div>
      <span class="badge">{{ t_enum('entity_type', entity.entity_type) }}</span>
    </div>
  </div>
  {% if entity.aliases %}
    <div class="entry-meta">
      <strong>{{ t('common.also_catalogued_as') }}</strong> {{ entity.aliases | join(", ") }}
    </div>
  {% endif %}
  <p class="u-m-10px-0-0">{{ entity.summary }}</p>
</section>
