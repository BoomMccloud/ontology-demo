<section id="sec-evidence" class="section-block">
  <h2>{{ t('nav.evidence_notes') }}</h2>
  {% if evidence_notes %}
    <ul class="portal-list">
      {% for note in evidence_notes %}
        <li><a href="{{ note.href }}">{{ note.label }}</a></li>
      {% endfor %}
    </ul>
  {% else %}
    <p>{{ t('nav.no_evidence_notes') }}</p>
  {% endif %}
</section>
