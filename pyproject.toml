[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stock-ontology"
version = "0.1.0"
description = "Stock ontology extraction pipeline and read-only PM query agent backed by SQLite, sqlite-vec, and Gemini"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "google-genai>=1.0.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "sqlite-vec>=0.1.6",
    "typer>=0.12.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
stock-ontology = "stock_ontology.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.17.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stock_ontology"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["BLE", "TRY", "PLW1514"]
preview = true
