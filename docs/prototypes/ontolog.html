<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OntoLog mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root {
  --outer-bg: #DCE3F0;
  --paper: #F1F5FB;
  --sheet: #FFFFFF;
  --card: #FFFFFF;
  --card-hover: #F8FAFF;
  --card-shadow: 0 2px 8px rgba(30, 41, 82, 0.06), 0 1px 2px rgba(30, 41, 82, 0.04);
  --bar-shadow: 0 -4px 16px rgba(15, 23, 42, 0.06);
  --ink: #0F172A;
  --ink-2: #475569;
  --rule: #DCE3EE;
  --rule-strong: #CBD5E1;
  --accent-bg: #EEF2F9;

  --brand: #4338CA;
  --brand-strong: #3730A3;
  --brand-soft: #EEF2FF;
  --brand-border: #C7D2FE;
  --brand-grad: linear-gradient(135deg, #4F46E5 0%, #2563EB 100%);
  --brand-shadow: 0 4px 12px rgba(79, 70, 229, 0.28);

  --company: #1D4ED8;
  --company-bg: #EFF6FF;
  --company-border: #BFDBFE;
  --theme: #7C3AED;
  --theme-bg: #F5F3FF;
  --theme-border: #DDD6FE;
  --entity: #0F766E;
  --entity-bg: #F0FDFA;
  --entity-border: #99F6E4;
  --note: #B45309;
  --note-bg: #FFFBEB;
  --note-border: #FDE68A;

  --support: #059669;
  --support-bg: #ECFDF5;
  --support-border: #A7F3D0;
  --challenge: #E11D48;
  --challenge-bg: #FFF1F2;
  --challenge-border: #FECDD3;
  --warn: #D97706;
  --warn-bg: #FFFBEB;
  --warn-border: #FDE68A;

  --routine: #94A3B8;
  --focus: #4F46E5;
  --scrim: rgba(15, 23, 42, 0.45);
  --toast-bg: #1E1B4B;
  --toast-fg: #FFFFFF;

  --font-ui: "Inter Tight", system-ui, sans-serif;
  --font-source: "Source Serif 4", Georgia, serif;
  --size-title: 27px;
  --size-heading: 19px;
  --size-body: 15px;
  --size-quote: 15px;
  --size-meta: 13px;
  --size-small: 12px;
  --gutter: 16px;
  --margin-indent: 10px;
  --bar-height: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --outer-bg: #080C14; --paper: #0D121D; --sheet: #141B2B; --card: #182135; --card-hover: #1E2942;
    --card-shadow: 0 2px 10px rgba(0, 0, 0, 0.30);
    --bar-shadow: 0 -4px 18px rgba(0, 0, 0, 0.35);
    --ink: #F1F5F9; --ink-2: #94A3B8;
    --rule: #263248; --rule-strong: #334155;
    --accent-bg: rgba(148, 163, 184, 0.10);
    --brand: #818CF8; --brand-strong: #A5B4FC; --brand-soft: rgba(129, 140, 248, 0.16); --brand-border: rgba(129, 140, 248, 0.35);
    --brand-grad: linear-gradient(135deg, #6366F1 0%, #3B82F6 100%);
    --brand-shadow: 0 4px 14px rgba(99, 102, 241, 0.32);
    --company: #60A5FA; --company-bg: rgba(59, 130, 246, 0.16); --company-border: rgba(96, 165, 250, 0.34);
    --theme: #A78BFA; --theme-bg: rgba(139, 92, 246, 0.16); --theme-border: rgba(167, 139, 250, 0.35);
    --entity: #2DD4BF; --entity-bg: rgba(20, 184, 166, 0.16); --entity-border: rgba(45, 212, 191, 0.34);
    --note: #FBBF24; --note-bg: rgba(245, 158, 11, 0.15); --note-border: rgba(251, 191, 36, 0.34);
    --support: #34D399; --support-bg: rgba(16, 185, 129, 0.15); --support-border: rgba(52, 211, 153, 0.36);
    --challenge: #FB7185; --challenge-bg: rgba(244, 63, 94, 0.15); --challenge-border: rgba(251, 113, 133, 0.36);
    --warn: #FBBF24; --warn-bg: rgba(245, 158, 11, 0.15); --warn-border: rgba(251, 191, 36, 0.34);
    --routine: #64748B; --focus: #818CF8; --scrim: rgba(0, 0, 0, 0.62);
    --toast-bg: #312E81; --toast-fg: #FFFFFF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --outer-bg: #080C14; --paper: #0D121D; --sheet: #141B2B; --card: #182135; --card-hover: #1E2942;
  --card-shadow: 0 2px 10px rgba(0, 0, 0, 0.30);
  --bar-shadow: 0 -4px 18px rgba(0, 0, 0, 0.35);
  --ink: #F1F5F9; --ink-2: #94A3B8;
  --rule: #263248; --rule-strong: #334155;
  --accent-bg: rgba(148, 163, 184, 0.10);
  --brand: #818CF8; --brand-strong: #A5B4FC; --brand-soft: rgba(129, 140, 248, 0.16); --brand-border: rgba(129, 140, 248, 0.35);
  --brand-grad: linear-gradient(135deg, #6366F1 0%, #3B82F6 100%);
  --brand-shadow: 0 4px 14px rgba(99, 102, 241, 0.32);
  --company: #60A5FA; --company-bg: rgba(59, 130, 246, 0.16); --company-border: rgba(96, 165, 250, 0.34);
  --theme: #A78BFA; --theme-bg: rgba(139, 92, 246, 0.16); --theme-border: rgba(167, 139, 250, 0.35);
  --entity: #2DD4BF; --entity-bg: rgba(20, 184, 166, 0.16); --entity-border: rgba(45, 212, 191, 0.34);
  --note: #FBBF24; --note-bg: rgba(245, 158, 11, 0.15); --note-border: rgba(251, 191, 36, 0.34);
  --support: #34D399; --support-bg: rgba(16, 185, 129, 0.15); --support-border: rgba(52, 211, 153, 0.36);
  --challenge: #FB7185; --challenge-bg: rgba(244, 63, 94, 0.15); --challenge-border: rgba(251, 113, 133, 0.36);
  --warn: #FBBF24; --warn-bg: rgba(245, 158, 11, 0.15); --warn-border: rgba(251, 191, 36, 0.34);
  --routine: #64748B; --focus: #818CF8; --scrim: rgba(0, 0, 0, 0.62);
  --toast-bg: #312E81; --toast-fg: #FFFFFF;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--ink); font: 400 var(--size-body)/1.45 var(--font-ui); -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
a { color: inherit; }

.app { max-width: 430px; margin: 0 auto; min-height: 100%; position: relative; background: var(--paper); }
@media (min-width: 600px) {
  body { background: var(--outer-bg); }
  .app { min-height: 100vh; border-left: 1px solid var(--rule); border-right: 1px solid var(--rule); box-shadow: 0 12px 40px rgba(15, 23, 42, 0.12); }
}

.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2;
  background: var(--sheet); border-bottom: 1px solid var(--rule);
  display: flex; align-items: center; justify-content: space-between;
  min-height: 52px; padding: 8px var(--gutter);
}
.back { border: 0; background: none; padding: 6px 0; color: var(--brand); font-size: var(--size-meta); font-weight: 500; }
.back[hidden] { display: none; }
.brand { border: 0; background: none; padding: 6px 0; font-weight: 600; font-size: 17px; letter-spacing: -0.3px; display: inline-flex; align-items: center; gap: 8px; color: var(--ink); }
.brand::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--brand-grad); box-shadow: 0 2px 6px rgba(79, 70, 229, 0.35); }
.brand[hidden] { display: none; }
.theme-toggle { border: 1px solid var(--rule); background: var(--paper); border-radius: 999px; padding: 5px 12px; color: var(--ink-2); font-size: var(--size-small); font-weight: 500; }
main { padding: 4px var(--gutter) calc(var(--bar-height) + 40px); }

h1 { font-size: var(--size-title); font-weight: 600; letter-spacing: -0.5px; line-height: 1.15; margin: 12px 0 4px; color: var(--ink); }
h2 {
  font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--ink); margin: 26px 0 10px; padding-bottom: 8px;
  border-bottom: 1px solid var(--rule);
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.sec-title { display: inline-flex; align-items: center; gap: 8px; }
.sec-title::before { content: ""; display: inline-block; width: 4px; height: 14px; border-radius: 999px; background: var(--sec-accent, var(--brand)); }
.sec-count {
  font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
  background: var(--sec-soft, var(--brand-soft)); color: var(--sec-accent, var(--brand));
  font-variant-numeric: tabular-nums;
}
h2.sec-theses { --sec-accent: var(--brand); --sec-soft: var(--brand-soft); }
h2.sec-news { --sec-accent: var(--company); --sec-soft: var(--company-bg); }
h2.sec-captured { --sec-accent: var(--warn); --sec-soft: var(--warn-bg); }
h2.sec-consensus { --sec-accent: var(--brand); --sec-soft: var(--brand-soft); }
h2.sec-questions { --sec-accent: var(--theme); --sec-soft: var(--theme-bg); }
h2.sec-notes { --sec-accent: var(--note); --sec-soft: var(--note-bg); }
h2.sec-company { --sec-accent: var(--company); --sec-soft: var(--company-bg); }
h2.sec-theme { --sec-accent: var(--theme); --sec-soft: var(--theme-bg); }
h2.sec-entity { --sec-accent: var(--entity); --sec-soft: var(--entity-bg); }
h2.sec-support { --sec-accent: var(--support); --sec-soft: var(--support-bg); }
h2.sec-risk { --sec-accent: var(--challenge); --sec-soft: var(--challenge-bg); }

.kind { color: var(--ink-2); font-size: var(--size-meta); margin: 8px 0 0; }
.kind-badge {
  display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px;
  font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
  border: 1px solid transparent;
}
.kind-company { background: var(--company-bg); color: var(--company); border-color: var(--company-border); }
.kind-theme { background: var(--theme-bg); color: var(--theme); border-color: var(--theme-border); }
.kind-entity { background: var(--entity-bg); color: var(--entity); border-color: var(--entity-border); }
.kind-note { background: var(--note-bg); color: var(--note); border-color: var(--note-border); }
.kind-cross { background: var(--brand-soft); color: var(--brand); border-color: var(--brand-border); }

.lede { margin: 0; }
.meta { color: var(--ink-2); font-size: var(--size-small); }
.subhead {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
  margin: 18px 0 8px; padding: 6px 10px; border-radius: 8px;
  color: var(--ink-2); background: var(--accent-bg);
}
.subhead.support { color: var(--support); background: var(--support-bg); border: 1px solid var(--support-border); }
.subhead.detract { color: var(--challenge); background: var(--challenge-bg); border: 1px solid var(--challenge-border); }

.list-card {
  background: var(--card); border: 1px solid var(--rule); border-radius: 14px;
  box-shadow: var(--card-shadow); overflow: hidden;
}
.row { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--rule); background: none; padding: 12px 0; transition: background-color 120ms ease; }
.list-card .row { padding: 13px 14px; }
.list-card .row:last-child { border-bottom: 0; }
.list-card button.row:hover { background: var(--card-hover); }
.row-head { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.row-name { font-weight: 600; color: var(--ink); display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row-name .kind { font-weight: 400; margin-left: 4px; }
.when { color: var(--ink-2); font-size: var(--size-small); font-variant-numeric: tabular-nums; white-space: nowrap; }
.count-pill { background: var(--accent-bg); color: var(--ink-2); padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }

.item-hero {
  margin-top: 12px; padding: 16px; border-radius: 16px;
  background: linear-gradient(180deg, var(--brand-soft) 0%, var(--card) 58%); border: 1px solid var(--brand-border);
  box-shadow: var(--card-shadow);
}
.item-hero.kind-company { background: linear-gradient(180deg, var(--company-bg) 0%, var(--card) 58%); border-color: var(--company-border); }
.item-hero.kind-theme { background: linear-gradient(180deg, var(--theme-bg) 0%, var(--card) 58%); border-color: var(--theme-border); }
.item-hero.kind-entity { background: linear-gradient(180deg, var(--entity-bg) 0%, var(--card) 58%); border-color: var(--entity-border); }
.item-hero.kind-note { background: linear-gradient(180deg, var(--note-bg) 0%, var(--card) 58%); border-color: var(--note-border); }
.item-hero h1 { margin: 8px 0 0; font-size: 25px; }
.item-hero .status { margin-top: 10px; }

.consensus-card {
  padding: 14px 15px; border-radius: 12px;
  background: var(--brand-soft); border: 1px solid var(--brand-border);
}
.consensus-card .lede { font-family: var(--font-source); font-size: 15.5px; line-height: 1.55; color: var(--ink); }

.source-card {
  margin-top: 14px; padding: 16px; border-radius: 14px;
  background: var(--note-bg); border: 1px solid var(--note-border);
  box-shadow: var(--card-shadow);
}
.source-card .source-text { margin: 0; }

.q-row-body { display: flex; align-items: flex-start; gap: 10px; flex: 1; min-width: 0; }
.q-icon {
  flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%; margin-top: 1px;
  background: var(--theme-bg); color: var(--theme); border: 1px solid var(--theme-border);
  display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700;
}
.ask-pill {
  flex-shrink: 0; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
  background: var(--theme-bg); color: var(--theme); border: 1px solid var(--theme-border); white-space: nowrap;
}

.quote {
  font-family: var(--font-source); font-style: italic; font-size: var(--size-quote); line-height: 1.5;
  margin: 10px 0 0; padding: 10px 12px; border-radius: 10px;
  background: var(--accent-bg); border: 1px solid var(--rule); color: var(--ink);
}
.quote.challenge { border-color: var(--challenge-border); background: var(--challenge-bg); }
.quote.support { border-color: var(--support-border); background: var(--support-bg); }
.cite { display: block; text-align: left; margin: 8px 0 0; color: var(--ink-2); font-size: var(--size-small); }
.cite.flat { margin-left: 0; margin-top: 6px; }
.stance { font-size: var(--size-small); font-weight: 600; margin: 0; }
.stance.flat { margin-left: 0; }
.stance.challenge { color: var(--challenge); }
.stance.support { color: var(--support); }
.stance.routine { color: var(--ink-2); }

.view-text { margin: 10px 0 0; }
.pair { margin-top: 10px; }
.pair-label { font-size: var(--size-small); color: var(--challenge); font-weight: 500; margin-top: 12px; }

.status {
  display: inline-flex; align-items: center; font-size: 11.5px; font-weight: 600;
  color: var(--ink-2); background: var(--accent-bg); padding: 3px 9px; border-radius: 999px; white-space: nowrap;
}
.status.queued::before, .status.processing::before, .status.watching::before, .status.support::before, .status.challenge::before {
  content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--routine); margin-right: 6px;
}
.status.watching { background: var(--warn-bg); color: var(--warn); }
.status.watching::before { background: var(--warn); }
.status.queued, .status.processing { background: var(--warn-bg); color: var(--warn); }
.status.queued::before, .status.processing::before { background: var(--warn); }
.status.processing::before { animation: pulse 1s ease-in-out infinite alternate; }
.status.support { color: var(--support); background: var(--support-bg); font-weight: 600; }
.status.support::before { background: var(--support); }
.status.challenge { color: var(--challenge); background: var(--challenge-bg); font-weight: 600; }
.status.challenge::before { background: var(--challenge); }
@keyframes pulse { to { opacity: 0.25; } }
@media (prefers-reduced-motion: reduce) { .status.processing::before { animation: none; } }

.source-text { font-family: var(--font-source); font-size: 17px; line-height: 1.6; margin: 16px 0 0; }
.note-snippet { margin: 6px 0 0; font-family: var(--font-source); font-size: 14px; line-height: 1.45; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.link { border: 0; background: none; padding: 0; color: var(--brand); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--brand-border); text-align: left; }

.empty { padding: 48px 0 0; }
.empty p { color: var(--ink-2); margin: 8px 0 20px; max-width: 30ch; }
.primary { border: 0; border-radius: 10px; background: var(--brand-grad); color: #FFFFFF; padding: 11px 18px; font-weight: 600; box-shadow: 0 2px 8px rgba(79, 70, 229, 0.22); }
.primary:disabled { opacity: 0.45; cursor: default; box-shadow: none; }
.secondary { border: 1px solid var(--brand-border); border-radius: 10px; background: var(--card); color: var(--brand); padding: 10px 16px; font-weight: 500; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
.proto { margin-top: 40px; color: var(--ink-2); font-size: var(--size-small); }

/* Rich elevated card components for Feed, Theses & Configurator */
.card-stack { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.card {
  display: block; width: 100%; text-align: left;
  background: var(--card); border: 1px solid var(--rule);
  border-radius: 14px; padding: 14px; box-shadow: var(--card-shadow);
  transition: border-color 140ms ease, background-color 140ms ease, transform 140ms ease;
}
button.card:hover { border-color: var(--brand-border); background: var(--card-hover); }
.card.thesis-card { border-color: var(--brand-border); }
.card.thesis-card.support { border-color: var(--support-border); }
.card.thesis-card.challenge { border-color: var(--challenge-border); }
.card.feed-card { border-color: var(--rule); }
.card.feed-card.support { border-color: var(--support-border); }
.card.feed-card.challenge { border-color: var(--challenge-border); }
.card.cta-card { background: var(--brand-soft); border: 1px dashed var(--brand-border); }
.card-title { font-weight: 600; font-size: var(--size-body); line-height: 1.35; margin: 0; color: var(--ink); }
.card-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 10px; font-size: var(--size-small); color: var(--ink-2); }

.pill-badge {
  display: inline-flex; align-items: center; gap: 5px;
  border-radius: 999px; padding: 3px 9px; font-size: 11px; font-weight: 600;
  background: var(--accent-bg); color: var(--ink-2); border: 1px solid transparent; white-space: nowrap;
}
.pill-badge.brand { background: var(--brand-soft); color: var(--brand); border-color: var(--brand-border); }
.pill-badge.theme { background: var(--theme-bg); color: var(--theme); border-color: var(--theme-border); }
.pill-badge.support { background: var(--support-bg); color: var(--support); border-color: var(--support-border); }
.pill-badge.challenge { background: var(--challenge-bg); color: var(--challenge); border-color: var(--challenge-border); }
.pill-badge.routine { background: var(--accent-bg); color: var(--ink-2); border-color: var(--rule); }
.pill-badge.link-pill { border: 1px solid var(--rule); background: var(--card); color: var(--ink); }
.pill-badge.link-pill.kind-company { background: var(--company-bg); color: var(--company); border-color: var(--company-border); }
.pill-badge.link-pill.kind-theme { background: var(--theme-bg); color: var(--theme); border-color: var(--theme-border); }

.baseline-box {
  margin-top: 12px; padding: 14px; border-radius: 12px;
  background: var(--brand-soft); border: 1px solid var(--brand-border);
}
.baseline-kicker { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--brand); margin: 0; }
.baseline-metric { font-size: 18px; font-weight: 700; margin: 4px 0; letter-spacing: -0.2px; color: var(--brand-strong); }
.baseline-copy { font-family: var(--font-source); font-size: 14px; line-height: 1.45; margin: 0; color: var(--ink); }

/* 1-Page Configurator & Add-on Cards */
.step-card {
  margin-top: 14px; padding: 15px; border-radius: 14px;
  background: var(--card); border: 1px solid var(--rule); box-shadow: var(--card-shadow);
}
.step-head { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
.step-num {
  width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: #FFFFFF;
}
.step-num.step-1 { background: var(--brand); }
.step-num.step-2 { background: var(--theme); }
.step-num.step-3 { background: var(--entity); }
.step-tag { display: inline-block; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink); margin: 0; }

.theme-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
.theme-chip { border: 1px solid var(--rule); background: var(--paper); border-radius: 999px; padding: 5px 12px; font-size: var(--size-small); color: var(--ink-2); font-weight: 500; }
.theme-chip[aria-pressed="true"] { background: var(--theme); color: #FFFFFF; border-color: var(--theme); font-weight: 600; }

.custom-driver-row { display: flex; gap: 8px; margin-top: 4px; }
.custom-driver-row input { flex: 1; }
.custom-chip-list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }

.search {

dialog.sheet { border: 0; padding: 0; margin: auto auto 0; width: 100%; max-width: 430px; max-height: 88vh; background: var(--sheet); color: var(--ink); border-radius: 18px 18px 0 0; box-shadow: 0 -8px 32px rgba(15, 23, 42, 0.18); }

.sheet-head { display: flex; justify-content: space-between; align-items: center; padding: 14px var(--gutter) 10px; border-bottom: 1px solid var(--rule); }

.chooser-option {
  display: block; width: 100%; text-align: left; background: var(--brand-soft);

  box-shadow: var(--card-shadow);
}

.chooser-option strong { display: block; font-size: 16px; margin-bottom: 3px; color: var(--ink); }
.chooser-option span { display: block; font-size: var(--size-small); color: var(--ink-2); }

.chat { position: fixed; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; bottom: calc(var(--bar-height) + env(safe-area-inset-bottom)); height: 62vh; background: var(--sheet); border-top: 1px solid var(--brand-border); border-radius: 18px 18px 0 0; box-shadow: 0 -8px 30px rgba(15, 23, 42, 0.16); display: flex; flex-direction: column; z-index: 4; }

.chat .sheet-head { background: var(--brand-soft); border-radius: 18px 18px 0 0; }

.chat .sheet-foot { padding-bottom: 12px; background: var(--sheet); }
.chat-heading { min-width: 0; }
.chat-context { color: var(--brand); font-size: var(--size-small); font-weight: 500; }
.chat-tools { display: flex; gap: 14px; }
.foot-actions { display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px; }

.field { width: 100%; border: 1px solid var(--rule-strong); border-radius: 10px; background: var(--paper); padding: 10px 12px; }

textarea.field { min-height: 150px; resize: vertical; font-family: var(--font-source); font-size: 16px; line-height: 1.55; }

.hint button { border: 0; background: none; color: var(--brand); padding: 0 4px; font-weight: 700; }

.msg { margin: 0 0 14px; }
.msg.you { text-align: right; }
.msg.you span { display: inline-block; background: var(--brand-grad); color: #FFFFFF; border: 0; border-radius: 14px 14px 4px 14px; padding: 9px 13px; text-align: left; max-width: 85%; box-shadow: 0 2px 8px rgba(79, 70, 229, 0.2); }
.msg.agent { background: var(--card); border: 1px solid var(--rule); border-radius: 14px 14px 14px 4px; padding: 12px 13px; box-shadow: var(--card-shadow); }

.msg.agent .cite { margin-left: 0; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }

<body>
<div class="app">
  <header class="top">
    <button class="brand" id="brand">OntoLog</button>
    <button class="back" id="back" hidden><span aria-hidden="true">‹ </span><span id="back-label"></span></button>
    <button class="theme-toggle" id="theme-toggle" type="button">Dark</button>
  </header>
  <main id="screen" tabindex="-1"></main>

  <nav class="bar" id="bar" aria-label="Main navigation">
    <div class="slot">
      <button id="nav-recent">Recent</button>
      <button id="nav-sources" hidden>Notes</button>
      <button id="nav-edit-thesis" hidden>Edit</button>
    </div>
    <button class="plus" id="nav-capture" aria-label="Add">+</button>
    <div class="slot">
      <button id="nav-ontology">Coverage</button>
      <button id="nav-chat" aria-controls="chat" aria-expanded="false" hidden>Chat</button>
    </div>
  </nav>

  <div class="checkout-bar" id="checkout-bar" hidden>
    <div class="checkout-meta">
      <strong id="checkout-count">0 drivers selected</strong>
      <span id="checkout-sub">Ready to track</span>
    </div>
    <button class="primary" id="checkout-submit" type="button">Create &amp; watch</button>
  </div>
</div>

<!-- Chooser when tapping + on Company or Theme -->
<dialog class="sheet" id="add-chooser" aria-labelledby="chooser-title">
  <div class="sheet-head"><strong id="chooser-title">Add to Apple</strong><button type="button" id="chooser-cancel">Cancel</button></div>
  <div class="sheet-body">
    <button type="button" class="chooser-option" id="choose-thesis">
      <strong id="choose-thesis-label">Add a thesis</strong>
      <span id="choose-thesis-sub">State a hunch, pull ontology findings, and watch drivers</span>
    </button>
    <button type="button" class="chooser-option" id="choose-note">
      <strong>Add a note</strong>
      <span>Capture a quote, meeting note, or excerpt</span>
    </button>
  </div>
</dialog>

<!-- Capture Note Sheet -->
<dialog class="sheet" id="capture" aria-labelledby="capture-title">
  <form id="capture-form" method="dialog" novalidate>
    <div class="sheet-head"><strong id="capture-title">New note</strong><button type="button" id="capture-cancel">Cancel</button></div>
    <div class="sheet-body">
      <div id="capture-hint"></div>
      <input class="field" id="capture-name" placeholder="Supplier call, packaging costs" aria-label="Title">
      <div style="height:10px"></div>
      <textarea class="field" id="capture-text" placeholder="What did you hear? Paste an excerpt or dictate with the keyboard." aria-label="Note"></textarea>
      <p class="error" id="capture-error" role="alert"></p>
      <button type="button" class="link meta" id="capture-sample">Use a sample note</button>
    </div>
    <div class="sheet-foot foot-actions"><button class="secondary" type="submit" value="research">Research</button><button class="primary" type="submit" value="process">Save and process</button></div>
  </form>
</dialog>

<!-- Drop News Sheet (from Live Thesis + button) -->
<dialog class="sheet" id="news-sheet" aria-labelledby="news-sheet-title">
  <form id="custom-news-form" method="dialog" novalidate>
    <div class="sheet-head"><strong id="news-sheet-title">Drop news headline</strong><button type="button" id="news-sheet-cancel">Cancel</button></div>
    <div class="sheet-body">
      <p class="meta" style="margin-top:0">See how an incoming headline maps directly onto a watched driver.</p>
      <textarea class="field" id="custom-news-text" placeholder="e.g. Verizon reports Q4 family-plan iPhone upgrades jumped 19% YoY" aria-label="Headline text" style="min-height:92px"></textarea>
      <p class="error" id="custom-news-error" role="alert"></p>
      <div class="actions" style="margin-top:8px"><button class="primary" type="submit">Map headline</button></div>
      <p class="sheet-divider">Or simulate incoming headline</p>
      <div id="news-sheet-presets" class="card-stack"></div>
    </div>
  </form>
</dialog>

<!-- Source Preview Sheet -->
<dialog class="sheet" id="source-sheet" aria-labelledby="source-sheet-title">
  <div class="sheet-head"><strong id="source-sheet-title">Source</strong><button type="button" id="source-sheet-close">Close</button></div>
  <div class="sheet-body" id="source-sheet-body"></div>
</dialog>

<!-- Research Chat Sheet -->
<section class="chat" id="chat" role="dialog" aria-modal="false" aria-labelledby="chat-title" hidden>
  <div class="sheet-head"><div class="chat-heading"><strong id="chat-title">Research chat</strong><div class="chat-context" id="chat-context"></div></div>
    <div class="chat-tools"><button type="button" id="chat-expand" aria-expanded="false">Expand</button><button type="button" id="chat-close">Minimize</button></div></div>
  <div class="sheet-body" id="chat-log" aria-live="polite"></div>
  <div class="sheet-foot">
    <div class="chips">
      <button type="button" data-ask="What supports this?">What supports this?</button>
      <button type="button" data-ask="What would refute it?">What would refute it?</button>
    </div>
    <form class="composer" id="chat-form">
      <input class="field" id="chat-input" placeholder="Ask about evidence or rollout timing…" aria-label="Message">
      <button class="primary" type="submit">Send</button>
    </form>
  </div>
</section>

<div class="toast" id="toast" role="status" hidden></div>

function load(empty) {
  const now = Date.now();
  state = { notes: {}, items: {}, views: [], theses: [] };
  if (!empty) {
    Object.entries(CATALOG).forEach(([id, data]) => { state.items[id] = { id, ...data }; });
    SAMPLE_NOTES.forEach(note => ingest({ ...note, at: now - note.hoursAgo * 3600e3, status: "processed" }, note.views));
    state.theses = SEEDED_THESES.map(t => ({ ...t, customDrivers: [...t.customDrivers], selectedAddonIds: [...t.selectedAddonIds], mappedNews: [] }));
  }
  history = [];
  current = { screen: "recent" };
  builder = null;
  Object.keys(chats).forEach(key => delete chats[key]);
  render();
}

function ingest(note, views) {
  state.notes[note.id] = note;
  note.items.forEach(id => { if (!state.items[id]) state.items[id] = { id, ...CATALOG[id] }; });
  views.forEach(view => state.views.push({ ...view, note: note.id, at: note.at }));
}

function ago(at) {
  const minutes = Math.max(0, Math.round((Date.now() - at) / 60e3));
  if (minutes < 1) return "now";
  if (minutes < 60) return minutes + "m";
  const hours = Math.round(minutes / 60);
  return hours < 24 ? hours + "h" : Math.round(hours / 24) + "d";
}

const since = at => { const value = ago(at); return value === "now" ? "just now" : value + " ago"; };
const viewsFor = id => state.views.filter(view => view.item === id).sort((a, b) => b.at - a.at);
const notesFor = id => Object.values(state.notes).filter(note => note.items.includes(id)).sort((a, b) => b.at - a.at);
const thesesForItem = id => state.theses.filter(t => t.companyId === id || t.themeId === id);
const thesisById = id => state.theses.find(t => t.id === id);
const statusWord = { ready: "Not processed", queued: "Queued", processing: "Processing" };
const stanceWord = { challenge: "Challenges a view", support: "Supports", routine: "Adds" };

function allAddonsFor(companyId, themeId) {
  return findingsForContext(companyId, themeId).addons;
}

function newsDeltaForAddon(addon, effect) {
  if (!addon) return 0;
  if (addon.kind === "support") return effect === "confirms" ? 1 : -1;
  return effect === "breaks" ? 1 : -1;
}

function thesisRealism(thesis) {
  const addons = allAddonsFor(thesis.companyId, thesis.themeId);
  const activeNews = thesis.mappedNews.filter(n => thesis.selectedAddonIds.includes(n.addonId));
  let score = 0;
  let bullish = 0;
  let bearish = 0;
  activeNews.forEach(item => {
    const addon = addons.find(a => a.id === item.addonId);
    const delta = newsDeltaForAddon(addon, item.effect);
    score += delta;
    if (delta > 0) bullish += 1;
    else if (delta < 0) bearish += 1;
  });

  let label = "Baseline · Unproven";
  let tone = "routine";
  if (activeNews.length > 0) {
    if (score >= 2) { label = "Much more realistic"; tone = "support"; }
    else if (score === 1) { label = "More realistic"; tone = "support"; }
    else if (score === 0) { label = "Mixed signals"; tone = "routine"; }
    else if (score === -1) { label = "Less realistic"; tone = "challenge"; }
    else { label = "Much less realistic"; tone = "challenge"; }
  }

  const totalWatched = thesis.customDrivers.length + thesis.selectedAddonIds.length;
  const tally = activeNews.length
    ? `${bullish} bullish · ${bearish} bearish signal${bullish + bearish === 1 ? "" : "s"}`
    : `${totalWatched} item${totalWatched === 1 ? "" : "s"} watched · 0 headlines`;

  const clamped = Math.max(-2, Math.min(2, score));
  const segs = [0, 1, 2, 3, 4].map(idx => {
    if (activeNews.length === 0) return idx === 2 ? "neutral" : "";
    if (clamped > 0 && idx >= 2 && idx <= 2 + clamped) return "support";
    if (clamped < 0 && idx <= 2 && idx >= 2 + clamped) return "challenge";
    if (clamped === 0 && idx === 2) return "neutral";
    return "";
  });

  return { label, tone, tally, segs, totalWatched, mappedCount: activeNews.length };
}

}

function addonStatus(addon, mappedItems) {
  if (!mappedItems.length) return { cls: "watching", text: "Watching" };
  const latest = mappedItems[0];
  const delta = newsDeltaForAddon(addon, latest.effect);
  if (addon.kind === "detract") {
    return delta < 0 ? { cls: "challenge", text: "Risk triggered" } : { cls: "support", text: "Broken" };
  }
  return delta > 0 ? { cls: "support", text: "Confirmed" } : { cls: "challenge", text: "Broken" };
}

function evidenceLabel(addon, item) {
  if (addon.kind === "detract") {
    return item.effect === "confirms"
      ? { cls: "challenge", text: "Confirms risk · Makes thesis less realistic" }
      : { cls: "support", text: "Refutes risk · Makes thesis more realistic" };
  }
  return item.effect === "confirms"
    ? { cls: "support", text: "Confirms driver · Makes thesis more realistic" }
    : { cls: "challenge", text: "Breaks driver · Makes thesis less realistic" };
}

function renderOntology() {
  return `<h1>Coverage</h1><input class="search" id="search-input" type="search" placeholder="Search companies, themes, and notes" aria-label="Search coverage" value="${esc(current.query || "")}"><div id="results">${searchResults(current.query || "")}</div>`;
}

function directory() {
  const groups = [["company", "Companies", "sec-company"], ["theme", "Themes", "sec-theme"], ["entity", "Entities", "sec-entity"]];
  const items = Object.values(state.items);
  if (!items.length) return `<p class="meta" style="margin-top:16px">Companies, themes, and entities appear here once a note is processed.</p>`;
  return groups.map(([kind, heading, secCls]) => {
    const group = items.filter(item => item.kind === kind).sort((a, b) => a.name.localeCompare(b.name));
    return group.length ? `${sectionHead(heading, secCls, group.length)}<div class="list-card">${group.map(item => `<button class="row" data-go="item" data-id="${item.id}"><div class="row-head"><span class="row-name">${esc(item.name)}</span><span class="count-pill">${notesFor(item.id).length} ${notesFor(item.id).length === 1 ? "note" : "notes"}</span></div></button>`).join("")}</div>` : "";
  }).join("");
}

function searchResults(query) {
  const q = query.trim().toLowerCase();
  if (!q) return directory();
  const items = Object.values(state.items).filter(item => (item.name + " " + item.consensus).toLowerCase().includes(q));
  const notes = Object.values(state.notes).filter(note => (note.title + " " + note.text).toLowerCase().includes(q));
  if (!items.length && !notes.length) return `<p class="meta" style="margin-top:16px">Nothing matches “${esc(query)}”. Try a company or theme name.</p>`;
  return `${items.length ? `${sectionHead("Companies and themes", "sec-company", items.length)}<div class="list-card">${items.map(item => `<button class="row" data-go="item" data-id="${item.id}"><div class="row-head"><span class="row-name">${esc(item.name)}${kindBadge(item.kind)}</span><span class="when">Open →</span></div></button>`).join("")}</div>` : ""}
    ${notes.length ? `${sectionHead("Notes", "sec-notes", notes.length)}<div class="list-card">${notes.map(note => `<button class="row" data-go="note" data-id="${note.id}"><div class="row-head"><span class="row-name" style="font-weight:500">${esc(note.title)}</span><span class="when">${ago(note.at)}</span></div></button>`).join("")}</div>` : ""}`;
}

function updateCheckoutBar() {
  if (!builder) return;
  const total = builder.customDrivers.length + builder.selectedAddonIds.length;
  $("#checkout-count").textContent = `${total} item${total === 1 ? "" : "s"} selected`;
  $("#checkout-sub").textContent = builder.populated ? "Market baseline included" : "Populate ontology to add drivers";
  $("#checkout-submit").textContent = builder.editingId ? "Update & watch" : "Create & watch";
}

function render(focus) {
  const views = {
    recent: renderRecent,
    item: () => renderItem(current.id),
    item_notes: () => renderItemNotes(current.id),
    note: () => renderNote(current.id),
    ontology: renderOntology,
    thesis_builder: renderThesisBuilder,
    thesis: () => renderThesisLive(current.id)
  };
  screen.innerHTML = views[current.screen]();
  const previous = history.at(-1);
  $("#back").hidden = !previous;
  $("#brand").hidden = Boolean(previous);
  if (previous) { $("#back-label").textContent = label(previous); $("#back").setAttribute("aria-label", "Back to " + label(previous)); }

  const isBuilder = current.screen === "thesis_builder";
  const isItem = current.screen === "item";
  const isItemNotes = current.screen === "item_notes";
  const isItemContext = isItem || isItemNotes;
  const isThesis = current.screen === "thesis";

  $("#bar").hidden = isBuilder;
  $("#checkout-bar").hidden = !isBuilder;
  if (isBuilder) updateCheckoutBar();

  $("#bar").setAttribute("aria-label", (isItemContext || isThesis) ? "Research navigation" : "Main navigation");
  $("#nav-recent").hidden = $("#nav-ontology").hidden = isItemContext || isThesis;
  $("#nav-sources").hidden = !isItemContext;
  $("#nav-edit-thesis").hidden = !isThesis;
  $("#nav-chat").hidden = !(isItemContext || isThesis);
  $("#nav-chat").setAttribute("aria-expanded", String(!$("#chat").hidden));
  $("#nav-capture").setAttribute("aria-label", isThesis ? "Drop news headline" : "Add");

  $("#nav-recent").toggleAttribute("aria-current", current.screen === "recent");
  $("#nav-ontology").toggleAttribute("aria-current", current.screen === "ontology");
  $("#nav-sources").toggleAttribute("aria-current", isItemNotes);
  if (current.screen === "recent") $("#nav-recent").setAttribute("aria-current", "page");
  if (isItemNotes) $("#nav-sources").setAttribute("aria-current", "page");

  if (current.screen === "ontology") {
    $("#nav-ontology").setAttribute("aria-current", "page");
    const input = $("#search-input");
    input.addEventListener("input", () => { current.query = input.value; $("#results").innerHTML = searchResults(input.value); });
    if (focus) input.focus();
  } else if (isBuilder) {
    wireBuilderEvents();
  } else if (focus) {
    screen.focus();
  }
}

function label(entry) {
  if (entry.screen === "item") return state.items[entry.id].name;
  if (entry.screen === "item_notes") return "Notes";
  if (entry.screen === "note") return state.notes[entry.id].title;
  if (entry.screen === "thesis") return "Thesis";
  if (entry.screen === "thesis_builder") return "Edit thesis";
  return entry.screen === "ontology" ? "Coverage" : "Recent";
}

function go(screenName, id) {
  if (current.screen === screenName && current.id === id) return;
  closeChat();
  history.push(current);
  current = { screen: screenName, id };
  render(true);
  window.scrollTo(0, 0);
}

function root(screenName) {
  closeChat();
  history = [];
  current = { screen: screenName, query: screenName === "ontology" ? current.query : undefined };
  render(true);
  window.scrollTo(0, 0);
}

function toast(message) {
  const el = $("#toast");
  el.textContent = message;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
}

/* Thesis Builder Lifecycle */
function startThesisBuilder({ companyId = null, themeId = null, existing = null } = {}) {
  closeChat();
  const comp = companyId ? state.items[companyId] : null;
  const resolvedTheme = themeId || (comp && comp.defaultTheme) || "edge_ai";
  if (existing) {
    builder = {
      editingId: existing.id,
      companyId: existing.companyId,
      themeId: existing.themeId,
      statement: existing.statement,
      customDrivers: [...existing.customDrivers],
      draftCustom: "",
      selectedAddonIds: [...existing.selectedAddonIds],
      populated: true,
      populating: false
    };
  } else {
    builder = {
      editingId: null,
      companyId,
      themeId: resolvedTheme,
      statement: "",
      customDrivers: [],
      draftCustom: "",
      selectedAddonIds: [],
      populated: false,
      populating: false
    };
  }
  history.push(current);
  current = { screen: "thesis_builder" };
  render(true);
  window.scrollTo(0, 0);
}

function wireBuilderEvents() {
  const st = $("#builder-statement");
  const customInput = $("#custom-driver-input");
  st.addEventListener("input", () => {
    builder.statement = st.value;
    $("#builder-error").textContent = "";
  });
  customInput.addEventListener("input", () => { builder.draftCustom = customInput.value; });
  customInput.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); addCustomDriver(); }
  });
  $("#add-custom-driver").addEventListener("click", addCustomDriver);
  $("#populate-findings").addEventListener("click", () => {
    if (builder.populated || builder.populating) return;
    builder.populating = true;
    render();
    setTimeout(() => {
      builder.populating = false;
      builder.populated = true;
      render();
    }, 600);
  });
}

function addCustomDriver() {
  const val = ($("#custom-driver-input").value || "").trim();
  if (!val) return;
  builder.customDrivers.push(val);
  builder.draftCustom = "";
  render();
  toast("Added custom driver.");
}

function checkoutThesis() {
  const text = (builder.statement || "").trim();
  if (!text) {
    $("#builder-error").textContent = "State your thesis first, or tap the sample above.";
    $("#builder-statement").focus();
    return;
  }
  const findings = findingsForContext(builder.companyId, builder.themeId);
  let targetId;
  if (builder.editingId) {
    const existing = thesisById(builder.editingId);
    existing.statement = text;
    existing.themeId = builder.themeId;
    existing.customDrivers = [...builder.customDrivers];
    existing.selectedAddonIds = [...builder.selectedAddonIds];
    targetId = existing.id;
    toast("Thesis updated.");
  } else {
    targetId = "th_" + Date.now();
    state.theses.unshift({
      id: targetId,
      companyId: builder.companyId,
      themeId: builder.themeId,
      statement: text,
      baselineMetric: findings.baselineMetric,
      baselineDetail: findings.baselineDetail,
      customDrivers: [...builder.customDrivers],
      selectedAddonIds: [...builder.selectedAddonIds],
      mappedNews: [],
      createdAt: Date.now()
    });
    toast("Thesis created — watching drivers.");
  }
  if (history.length && history.at(-1).screen === "thesis" && history.at(-1).id === targetId) {
    history.pop();
  }
  builder = null;
  // Replace builder in navigation with the live thesis so Back goes to Company/Theme
  current = { screen: "thesis", id: targetId };
  render(true);
  window.scrollTo(0, 0);
}

/* News dropping & custom headline classification on Live Thesis */
function dropPresetOnThesis(presetId) {
  if (current.screen !== "thesis") return;
  const thesis = thesisById(current.id);
  const preset = PRESET_NEWS.find(p => p.id === presetId);
  if (!thesis || !preset || thesis.mappedNews.some(n => n.id === preset.id)) return;
  const addon = allAddonsFor(thesis.companyId, thesis.themeId).find(a => a.id === preset.addonId);

  if (!thesis.selectedAddonIds.includes(preset.addonId)) {
    state.unwatchedPrompt = { thesisId: thesis.id, preset };
    if ($("#news-sheet").open) $("#news-sheet").close();
    render();
    toast(`${addon.name} wasn’t added yet — add it to map this news.`);
    return;
  }

  thesis.mappedNews.unshift(preset);
  if ($("#news-sheet").open) $("#news-sheet").close();
  render();
  const delta = newsDeltaForAddon(addon, preset.effect);
  toast(`Mapped to ${addon.name} · ${delta > 0 ? "More realistic" : "Less realistic"}`);
}

function classifyCustomHeadline(text, thesis) {
  const lower = text.toLowerCase();
  let addonId = "gifting";
  if (/battery|power|drain|thermal|overheat/.test(lower)) addonId = "priority_mismatch";
  else if (/delay|slip|eu|europe|china|regulat|late|postpone/.test(lower)) addonId = "rollout_delay";
  else if (/chatgpt|gemini|claude|third-party|3rd party|substitut|retention|stick|app/.test(lower)) addonId = "app_substitution";
  else if (/chip|silicon|a20|ram|3\+|older|trade-in|cycle|gate/.test(lower)) addonId = "hardware_gate";

  const addons = allAddonsFor(thesis.companyId, thesis.themeId);
  let addon = addons.find(a => a.id === addonId) || addons[0];
  let effect = "confirms";
  if (/no delay|on time|ahead|approved|passed|holds|minimal drain|within \d+%|false|no issue|didn't|did not|rebound/.test(lower)) {
    effect = "breaks";
  } else if (addon.kind === "support" && /slow|weak|miss|drop|fell|decline|stall|fail/.test(lower)) {
    effect = "breaks";
  }

  const delta = newsDeltaForAddon(addon, effect);
  return {
    id: "custom_" + Date.now(),
    addonId: addon.id,
    effect,
    sourceTitle: "Custom headline",
    credibility: "Unrated",
    age: "just now",
    headline: text,
    agentNote: delta > 0 ? `Mapped to ${addon.name} — makes thesis more realistic.` : `Mapped to ${addon.name} — makes thesis less realistic.`
  };
}

function openNewsSheet() {
  const thesis = thesisById(current.id);
  if (!thesis) return;
  $("#custom-news-text").value = "";
  $("#custom-news-error").textContent = "";
  $("#news-sheet-presets").innerHTML = PRESET_NEWS.map(p => renderPresetNewsRow(thesis, p)).join("");
  $("#news-sheet").showModal();
  $("#custom-news-text").focus();
}

function openSourceSheet(sourceId) {
  const src = SOURCES[sourceId] || SOURCES.generic_src;
  $("#source-sheet-title").textContent = src.title;
  $("#source-sheet-body").innerHTML = `<p class="meta" style="margin-top:0">Credibility: <strong>${esc(src.credibility)}</strong> · ${esc(src.date)}</p><p class="source-text">${esc(src.excerpt)}</p>`;
  $("#source-sheet").showModal();
}

/* Existing Capture & Chooser */
let captureHint = null;
let captureSummary = null;
function openCapture(prefill) {
  captureHint = (current.screen === "item" || current.screen === "item_notes") ? current.id : null;
  $("#capture-hint").innerHTML = captureHint ? `<span class="hint">For ${esc(state.items[captureHint].name)}<button type="button" aria-label="Remove hint" id="hint-remove">×</button></span>` : "";
  captureSummary = prefill ? prefill.summary : null;
  $("#capture-name").value = prefill ? prefill.title : "";
  $("#capture-text").value = prefill ? prefill.text : "";
  $("#capture-title").textContent = prefill ? "Save as note" : "New note";
  $("#capture-error").textContent = "";
  $("#capture").showModal();
  $("#capture-text").focus();
}

function openAddChooser() {
  const item = state.items[current.id];
  if (!item) return openCapture();
  $("#chooser-title").textContent = `Add to ${item.name}`;
  if (item.kind === "theme") {
    $("#choose-thesis-label").textContent = "Add a cross-company thesis";
    $("#choose-thesis-sub").textContent = `Track a narrative across companies in ${item.name}`;
  } else {
    $("#choose-thesis-label").textContent = "Add a thesis";
    $("#choose-thesis-sub").textContent = `State a hunch on ${item.name}, pull ontology findings, and watch drivers`;
  }
  $("#add-chooser").showModal();
}

function stanceOf(text) {
  if (/cost|delay|later|premium|elevated|lower margin|risk|cut/i.test(text)) return "challenge";
  if (/raised|strong|beat|ahead|lead|confirm/i.test(text)) return "support";
  return "routine";
}

function submitCapture(event) {
  event.preventDefault();
  const research = event.submitter && event.submitter.value === "research";
  const text = $("#capture-text").value.trim();
  if (!text) { $("#capture-error").textContent = "Write or paste the note first."; return; }
  const title = $("#capture-name").value.trim() || text.split(/[.!?]/)[0].slice(0, 48);
  const id = "c" + Date.now();
  const note = { id, title, text, at: Date.now(), status: "ready", items: [], hint: captureHint, summary: captureSummary };
  state.notes[id] = note;
  $("#capture").close();
  if (research) {
    go("note", id);
    toast("Saved. Not processed yet.");
    openChat();
    return;
  }
  startProcessing(note);
}

function startProcessing(note) {
  note.status = "queued";
  toast("Saved. Queued for processing.");
  render();
  setTimeout(() => { note.status = "processing"; render(); }, 1500);
  setTimeout(() => finishProcessing(note), 4500);
}

function finishProcessing(note) {
  const found = Object.keys(CATALOG).filter(key => CATALOG[key].match.test(note.text));
  if (note.hint && !found.includes(note.hint)) found.unshift(note.hint);
  const sentence = note.summary || note.text.split(/(?<=[.!?])\s+/)[0];
  note.status = "processed";
  note.at = Date.now();
  note.items = found;
  ingest(note, found.map(item => ({ item, stance: stanceOf(note.text), view: sentence, quote: sentence })));
  render();
  toast(found.length ? `Processed. Updated ${found.map(key => CATALOG[key].name).join(", ")}.` : "Processed. No companies or themes found.");
}

/* Research Chat */
function contextFor() {
  if (current.screen === "item" || current.screen === "item_notes") return { key: "item:" + current.id, name: state.items[current.id].name, notes: notesFor(current.id) };
  if (current.screen === "note") return { key: "note:" + current.id, name: state.notes[current.id].title, notes: [state.notes[current.id]] };
  if (current.screen === "thesis") {
    const t = thesisById(current.id);
    const notes = t.companyId ? notesFor(t.companyId) : (t.themeId ? notesFor(t.themeId) : []);
    return { key: "thesis:" + t.id, name: t.statement, thesis: t, notes: notes.length ? notes : Object.values(state.notes).slice(0, 2) };
  }
  return null;
}

function openChat(ask) {
  const context = contextFor();
  if (!context) return;
  chatKey = context.key;
  if (!chats[chatKey]) chats[chatKey] = { context, messages: [] };
  chats[chatKey].context = context;
  $("#chat-context").textContent = (current.screen === "note" ? "Focused on " : "About ") + context.name;
  drawChat();
  $("#chat").hidden = false;
  $("#nav-chat").setAttribute("aria-expanded", "true");
  if (ask) send(ask); else $("#chat-input").focus();
}

function closeChat() {
  $("#chat").hidden = true;
  $("#nav-chat").setAttribute("aria-expanded", "false");
}

function toggleExpand() {
  const expanded = $("#chat").classList.toggle("expanded");
  $("#chat-expand").setAttribute("aria-expanded", String(expanded));
  $("#chat-expand").textContent = expanded ? "Collapse" : "Expand";
}

function showSources() {
  closeChat();
  if (current.screen === "item" && current.id) {
    go("item_notes", current.id);
  }
}

function drawChat() {
  const chat = chats[chatKey];
  $("#chat-log").innerHTML = chat.messages.length ? chat.messages.map((message, index) => message.from === "you"
    ? `<div class="msg you"><span>${esc(message.text)}</span></div>`
    : message.pending ? `<p class="thinking">Reading the notes…</p>`
    : `<div class="msg agent">${message.html}<div class="actions"><button class="secondary" data-save="${index}">Save as note</button></div></div>`).join("")
    : `<p class="meta">Ask about ${esc(chat.context.name)}. Answers cite the notes they use.</p>`;
  const log = $("#chat-log");
  log.scrollTop = log.scrollHeight;
}

function reply(context, question) {
  const refute = /refute|against|wrong|risk/i.test(question);
  const cited = context.notes.slice(0, 3);
  const lead = refute
    ? `These notes cut against ${esc(context.name)}:`
    : /timing|rollout|delivery/i.test(question)
      ? `Here's what the notes say about timing for ${esc(context.name)}:`
      : `Here's what the notes say about ${esc(context.name)}:`;
  const pick = note => { const parts = note.text.split(/(?<=[.!?])\s+/); return refute ? parts.at(-1) : parts[0]; };
  const quotes = cited.map((note, i) => `<blockquote class="quote ${stanceOf(note.text)}">“${esc(pick(note))}”</blockquote>
    <button class="cite link" data-go="note" data-id="${note.id}">[${i + 1}] ${esc(note.title)}</button>`).join("");
  const close = context.thesis
    ? (refute
        ? "Watch EU/China regulatory timelines and third-party AI app retention — those would invalidate the near-term upgrade bump."
        : "Carrier family-plan mix and 3+ year trade-in share are the cleanest observable checks against the +5% baseline.")
    : refute || /which|likely|margin|hold/i.test(question)
      ? "Further channel checks or next-quarter guidance would settle this."
      : "These notes agree on the core driver; timing and margins remain the open test.";
  const plain = `${lead.replace(/&#39;/g, "'")}\n\n${cited.map((note, i) => `"${pick(note)}" [${i + 1}]`).join("\n")}\n\n${close}\n\n${cited.map((note, i) => `[${i + 1}] ${note.title}`).join("\n")}`;
  return { html: `<p>${lead}</p>${quotes}<p style="margin-top:10px">${close}</p>`, plain, title: `Chat on ${context.name.slice(0, 36)}`, summary: close.split(/(?<=[.!?])\s+/)[0] };
}

function send(text) {
  const chat = chats[chatKey];
  chat.messages.push({ from: "you", text });
  chat.messages.push({ from: "agent", pending: true });
  drawChat();
  setTimeout(() => {
    chat.messages.pop();
    chat.messages.push({ from: "agent", ...reply(chat.context, text) });
    drawChat();
  }, 900);
}

function toggleTheme() {
  const rootEl = document.documentElement;
  const prefersDark = matchMedia("(prefers-color-scheme: dark)").matches;
  const currentTheme = rootEl.getAttribute("data-theme") || (prefersDark ? "dark" : "light");
  const next = currentTheme === "dark" ? "light" : "dark";
  rootEl.setAttribute("data-theme", next);
  $("#theme-toggle").textContent = next === "dark" ? "Light" : "Dark";
}

document.addEventListener("click", event => {
  const target = event.target.closest("[data-go],[data-action],[data-save],[data-ask],[data-start-thesis],[data-start-cross-thesis],[data-fill-thesis],[data-pick-theme],[data-remove-custom],[data-toggle-addon],[data-source],[data-drop-news],[data-add-watch-map],[data-dismiss-unwatched]");
  if (!target) return;

  if (target.dataset.go) {
    go(target.dataset.go, target.dataset.id);
  } else if (target.dataset.save) {
    const message = chats[chatKey].messages[Number(target.dataset.save)];
    closeChat();
    openCapture({ title: message.title, text: message.plain, summary: message.summary });
  } else if (target.dataset.startThesis) {
    startThesisBuilder({ companyId: target.dataset.startThesis, themeId: target.dataset.themeHint || null });
  } else if (target.dataset.startCrossThesis) {
    startThesisBuilder({ companyId: null, themeId: target.dataset.startCrossThesis });
  } else if (target.dataset.fillThesis) {
    builder.statement = target.dataset.fillThesis;
    render();
  } else if (target.dataset.pickTheme) {
    builder.themeId = target.dataset.pickTheme;
    render();
  } else if (target.dataset.removeCustom !== undefined) {
    builder.customDrivers.splice(Number(target.dataset.removeCustom), 1);
    render();
  } else if (target.dataset.toggleAddon) {
    const id = target.dataset.toggleAddon;
    const idx = builder.selectedAddonIds.indexOf(id);
    if (idx >= 0) builder.selectedAddonIds.splice(idx, 1);
    else builder.selectedAddonIds.push(id);
    render();
  } else if (target.dataset.source) {
    openSourceSheet(target.dataset.source);
  } else if (target.dataset.dropNews) {
    dropPresetOnThesis(target.dataset.dropNews);
  } else if (target.dataset.addWatchMap) {
    const p = state.unwatchedPrompt;
    if (p && p.preset.id === target.dataset.addWatchMap) {
      const thesis = thesisById(p.thesisId);
      if (!thesis.selectedAddonIds.includes(p.preset.addonId)) thesis.selectedAddonIds.push(p.preset.addonId);
      thesis.mappedNews.unshift(p.preset);
      state.unwatchedPrompt = null;
      render();
      toast("Added driver to thesis and mapped headline.");
    }
  } else if (target.dataset.dismissUnwatched) {
    state.unwatchedPrompt = null;
    render();
  } else if (target.dataset.action === "capture") openCapture();
  else if (target.dataset.action === "chat") openChat(target.dataset.ask);
  else if (target.dataset.action === "process") startProcessing(state.notes[current.id]);
  else if (target.dataset.action === "empty") load(true);
  else if (target.dataset.action === "sample") load(false);
  else if (target.dataset.ask && !$("#chat").hidden) send(target.dataset.ask);
});

$("#back").addEventListener("click", () => {
  closeChat();
  builder = null;
  current = history.pop();
  render(true);
});
$("#brand").addEventListener("click", () => root("recent"));
$("#nav-recent").addEventListener("click", () => root("recent"));
$("#nav-ontology").addEventListener("click", () => root("ontology"));
$("#nav-sources").addEventListener("click", showSources);
$("#nav-edit-thesis").addEventListener("click", () => {
  const t = thesisById(current.id);
  if (t) startThesisBuilder({ existing: t });
});
$("#nav-capture").addEventListener("click", () => {
  if (current.screen === "item" && (state.items[current.id].kind === "company" || state.items[current.id].kind === "theme")) {
    openAddChooser();
  } else if (current.screen === "thesis") {
    openNewsSheet();
  } else {
    openCapture();
  }
});
$("#nav-chat").addEventListener("click", () => { if ($("#chat").hidden) openChat(); else closeChat(); });
$("#checkout-submit").addEventListener("click", checkoutThesis);

$("#chooser-cancel").addEventListener("click", () => $("#add-chooser").close());
$("#choose-thesis").addEventListener("click", () => {
  $("#add-chooser").close();
  const item = state.items[current.id];
  if (item && item.kind === "theme") startThesisBuilder({ companyId: null, themeId: item.id });
  else startThesisBuilder({ companyId: current.id });
});
$("#choose-note").addEventListener("click", () => {
  $("#add-chooser").close();
  openCapture();
});

$("#custom-news-form").addEventListener("submit", event => {
  event.preventDefault();
  const text = $("#custom-news-text").value.trim();
  if (!text) { $("#custom-news-error").textContent = "Enter a headline or pick one below."; return; }
  const thesis = thesisById(current.id);
  if (!thesis) return;
  const item = classifyCustomHeadline(text, thesis);
  if (!thesis.selectedAddonIds.includes(item.addonId)) thesis.selectedAddonIds.push(item.addonId);
  thesis.mappedNews.unshift(item);
  state.unwatchedPrompt = null;
  $("#news-sheet").close();
  render();
  const addon = allAddonsFor(thesis.companyId, thesis.themeId).find(a => a.id === item.addonId);
  toast(`Added & mapped to ${addon.name}.`);
});
$("#custom-news-text").addEventListener("input", () => { $("#custom-news-error").textContent = ""; });
$("#news-sheet-cancel").addEventListener("click", () => $("#news-sheet").close());
$("#source-sheet-close").addEventListener("click", () => $("#source-sheet").close());

$("#chat-close").addEventListener("click", closeChat);
$("#chat-expand").addEventListener("click", toggleExpand);
$("#capture-cancel").addEventListener("click", () => $("#capture").close());
$("#capture-form").addEventListener("submit", submitCapture);
$("#capture-sample").addEventListener("click", () => { $("#capture-text").value = SAMPLE_TEXT; $("#capture-name").value = "Supplier call, packaging"; $("#capture-error").textContent = ""; });
$("#capture-text").addEventListener("input", () => { $("#capture-error").textContent = ""; });
$("#capture-hint").addEventListener("click", event => { if (event.target.id === "hint-remove") { captureHint = null; $("#capture-hint").innerHTML = ""; } });
$("#chat-form").addEventListener("submit", event => {
  event.preventDefault();
  const input = $("#chat-input");
  if (input.value.trim()) { send(input.value.trim()); input.value = ""; }
});
$("#theme-toggle").addEventListener("click", toggleTheme);

(() => {
  const prefersDark = matchMedia("(prefers-color-scheme: dark)").matches;
  $("#theme-toggle").textContent = prefersDark ? "Light" : "Dark";
})();

setInterval(() => { if (!$("#capture").open && current.screen !== "ontology" && current.screen !== "thesis_builder") render(); }, 60e3);

load(false);
</script>
