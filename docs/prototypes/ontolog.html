<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OntoLog mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #EDF0F4;
  --sheet: #F7F8FA;
  --ink: #14213D;
  --ink-2: #5B6B85;
  --rule: #C3CAD5;
  --rule-strong: #14213D;
  --challenge: #B45309;
  --support: #047857;
  --routine: #94A3B8;
  --focus: #1D4ED8;
  --scrim: rgba(20, 33, 61, 0.32);
  --font-ui: "Inter Tight", system-ui, sans-serif;
  --font-source: "Source Serif 4", Georgia, serif;
  --size-title: 28px;
  --size-heading: 19px;
  --size-body: 15px;
  --size-quote: 15px;
  --size-meta: 13px;
  --size-small: 12px;
  --gutter: 16px;
  --margin-indent: 10px;
  --bar-height: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10151F; --sheet: #171E2B; --ink: #E4E9F1; --ink-2: #93A1B8;
    --rule: #2A3446; --rule-strong: #E4E9F1; --challenge: #F0A35A; --support: #4CC79A;
    --routine: #64748B; --focus: #7AA2FF; --scrim: rgba(0, 0, 0, 0.5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10151F; --sheet: #171E2B; --ink: #E4E9F1; --ink-2: #93A1B8;
  --rule: #2A3446; --rule-strong: #E4E9F1; --challenge: #F0A35A; --support: #4CC79A;
  --routine: #64748B; --focus: #7AA2FF; --scrim: rgba(0, 0, 0, 0.5); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--ink); font: 400 var(--size-body)/1.45 var(--font-ui); -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
a { color: inherit; }

.app { max-width: 430px; margin: 0 auto; min-height: 100%; position: relative; background: var(--paper); }
@media (min-width: 600px) { body { background: var(--rule); } .app { min-height: 100vh; border-left: 1px solid var(--rule); border-right: 1px solid var(--rule); } }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--paper); display: flex; align-items: center; justify-content: space-between; min-height: 48px; padding: 6px var(--gutter) 0; }
.back { border: 0; background: none; padding: 8px 0; color: var(--ink-2); font-size: var(--size-meta); }
.back[hidden] { display: none; }
.chat-open { border: 1px solid var(--rule-strong); background: none; border-radius: 8px; padding: 6px 12px; font-size: var(--size-meta); font-weight: 500; }
.chat-open[hidden] { display: none; }
main { padding: 0 var(--gutter) calc(var(--bar-height) + 32px); }

h1 { font-size: var(--size-title); font-weight: 500; letter-spacing: -0.4px; line-height: 1.15; margin: 4px 0 4px; }
h2 { font-size: var(--size-meta); font-weight: 600; margin: 28px 0 0; padding-bottom: 6px; border-bottom: 1px solid var(--rule-strong); }
.kind { color: var(--ink-2); font-size: var(--size-meta); }
.lede { margin: 12px 0 0; }
.meta { color: var(--ink-2); font-size: var(--size-small); }

.row { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--rule); background: none; padding: 12px 0; }
.row-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.row-name { font-weight: 500; }
.row-name .kind { font-weight: 400; margin-left: 4px; }
.when { color: var(--ink-2); font-size: var(--size-small); font-variant-numeric: tabular-nums; white-space: nowrap; }

.quote { font-family: var(--font-source); font-style: italic; font-size: var(--size-quote); line-height: 1.5; margin: 6px 0 0 var(--margin-indent); padding-left: var(--margin-indent); border-left: 2px solid var(--routine); }
.quote.challenge { border-color: var(--challenge); }
.quote.support { border-color: var(--support); }
.cite { display: block; text-align: left; margin: 4px 0 0 calc(var(--margin-indent) * 2 + 2px); color: var(--ink-2); font-size: var(--size-small); }
.stance { font-size: var(--size-small); font-weight: 500; margin: 0 0 0 calc(var(--margin-indent) * 2 + 2px); }
.stance.challenge { color: var(--challenge); }
.stance.support { color: var(--support); }
.stance.routine { color: var(--ink-2); }

.view-text { margin: 10px 0 0; }
.pair { margin-top: 10px; }
.pair-label { font-size: var(--size-small); color: var(--challenge); font-weight: 500; margin-top: 12px; }

.status { display: inline-block; font-size: var(--size-small); color: var(--ink-2); }
.status.queued::before, .status.processing::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--challenge); margin-right: 6px; vertical-align: 1px; }
.status.processing::before { animation: pulse 1s ease-in-out infinite alternate; }
@keyframes pulse { to { opacity: 0.25; } }
@media (prefers-reduced-motion: reduce) { .status.processing::before { animation: none; } }

.source-text { font-family: var(--font-source); font-size: 17px; line-height: 1.6; margin: 16px 0 0; }
.link { border: 0; background: none; padding: 0; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--rule); }

.empty { padding: 48px 0 0; }
.empty p { color: var(--ink-2); margin: 8px 0 20px; max-width: 30ch; }
.primary { border: 0; border-radius: 10px; background: var(--ink); color: var(--paper); padding: 11px 18px; font-weight: 500; }
.secondary { border: 1px solid var(--rule); border-radius: 10px; background: none; padding: 10px 16px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.proto { margin-top: 40px; color: var(--ink-2); font-size: var(--size-small); }

.bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; height: calc(var(--bar-height) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: var(--paper); border-top: 1px solid var(--rule); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; z-index: 3; }
.bar button { border: 0; background: none; color: var(--ink-2); font-size: var(--size-meta); padding: 12px; }
.bar button[aria-current="page"] { color: var(--ink); font-weight: 600; }
.bar .plus { width: 44px; height: 44px; border-radius: 12px; background: var(--ink); color: var(--paper); font-size: 24px; line-height: 1; padding: 0; }

.search { width: 100%; border: 0; border-bottom: 1px solid var(--rule-strong); background: none; padding: 10px 0; font-size: 17px; outline-offset: 4px; }

dialog.sheet { border: 0; padding: 0; margin: auto auto 0; width: 100%; max-width: 430px; max-height: 88vh; background: var(--sheet); color: var(--ink); border-radius: 16px 16px 0 0; }
dialog.sheet::backdrop { background: var(--scrim); }
dialog.sheet[open] { display: flex; flex-direction: column; animation: rise 180ms ease-out; }
@keyframes rise { from { transform: translateY(24px); opacity: 0.6; } }
@media (prefers-reduced-motion: reduce) { dialog.sheet[open] { animation: none; } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; padding: 14px var(--gutter) 8px; border-bottom: 1px solid var(--rule); }
.sheet-head strong { font-weight: 600; }
.sheet-head button { border: 0; background: none; color: var(--ink-2); padding: 6px 0; font-size: var(--size-meta); }
.sheet-body { padding: 12px var(--gutter) 16px; overflow-y: auto; }
.sheet-foot { padding: 10px var(--gutter) calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--rule); }

.field { width: 100%; border: 1px solid var(--rule); border-radius: 10px; background: var(--paper); padding: 10px 12px; }
textarea.field { min-height: 180px; resize: vertical; font-family: var(--font-source); font-size: 16px; line-height: 1.55; }
.hint { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule); border-radius: 999px; padding: 3px 4px 3px 10px; font-size: var(--size-small); margin-bottom: 10px; }
.hint button { border: 0; background: none; color: var(--ink-2); padding: 0 6px; }
.error { color: var(--challenge); font-size: var(--size-small); margin: 6px 0 0; min-height: 1em; }

.msg { margin: 0 0 16px; }
.msg.you { text-align: right; }
.msg.you span { display: inline-block; background: var(--paper); border: 1px solid var(--rule); border-radius: 12px; padding: 8px 12px; text-align: left; max-width: 85%; }
.msg.agent p { margin: 0 0 8px; }
.msg.agent .quote { margin-left: 0; }
.msg.agent .cite { margin-left: calc(var(--margin-indent) + 2px); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.chips button { border: 1px solid var(--rule); background: none; border-radius: 999px; padding: 5px 12px; font-size: var(--size-meta); }
.composer { display: flex; gap: 8px; }
.composer input { flex: 1; }
.thinking { color: var(--ink-2); font-size: var(--size-meta); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--bar-height) + 16px); background: var(--ink); color: var(--paper); border-radius: 10px; padding: 10px 14px; font-size: var(--size-meta); z-index: 5; max-width: 90%; }
.toast[hidden] { display: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="back" id="back" hidden>Back</button>
    <span></span>
    <button class="chat-open" id="chat-open" hidden>Chat</button>
  </header>
  <main id="screen" tabindex="-1"></main>
  <nav class="bar" aria-label="Main">
    <button id="nav-recent">Recent</button>
    <button class="plus" id="nav-capture" aria-label="Capture a note">+</button>
    <button id="nav-search">Search</button>
  </nav>
</div>

<dialog class="sheet" id="capture" aria-labelledby="capture-title">
  <form id="capture-form" method="dialog" novalidate>
    <div class="sheet-head"><strong id="capture-title">New note</strong><button type="button" id="capture-cancel">Cancel</button></div>
    <div class="sheet-body">
      <div id="capture-hint"></div>
      <input class="field" id="capture-name" placeholder="Supplier call, packaging costs" aria-label="Title">
      <div style="height:10px"></div>
      <textarea class="field" id="capture-text" placeholder="What did you hear? Paste an excerpt or dictate with the keyboard." aria-label="Note"></textarea>
      <p class="error" id="capture-error" role="alert"></p>
      <button type="button" class="link meta" id="capture-sample">Use a sample note</button>
    </div>
    <div class="sheet-foot"><button class="primary" type="submit" style="width:100%">Save and process</button></div>
  </form>
</dialog>

<dialog class="sheet" id="chat" aria-labelledby="chat-title">
  <div class="sheet-head"><strong id="chat-title">Chat</strong><button type="button" id="chat-close">Minimize</button></div>
  <div class="sheet-body" id="chat-log" aria-live="polite"></div>
  <div class="sheet-foot">
    <div class="chips">
      <button type="button" data-ask="What supports this?">What supports this?</button>
      <button type="button" data-ask="What would refute it?">What would refute it?</button>
    </div>
    <form class="composer" id="chat-form">
      <input class="field" id="chat-input" placeholder="What else have we heard about rollout timing?" aria-label="Message">
      <button class="primary" type="submit">Send</button>
    </form>
  </div>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>

<script>
const CATALOG = {
  groq: { name: "Groq", kind: "company", match: /groq/i,
    consensus: "Groq leads on low-latency inference. The open question is whether packaging costs let it hold a gross margin above 65%." },
  sram: { name: "SRAM Latency", kind: "theme", match: /sram|latency/i,
    consensus: "On-chip SRAM gives a durable latency edge for inference. Benchmarks cover one model size, and packaging cost affects the economics." },
  cowos: { name: "TSMC CoWoS Allocation", kind: "entity", match: /cowos|tsmc|packaging/i,
    consensus: "Advanced packaging capacity is the binding constraint for 2027 accelerator supply." },
  cerebras: { name: "Cerebras", kind: "company", match: /cerebras|wse/i,
    consensus: "Cerebras competes on wafer-scale inference throughput. Customer concentration is the main risk." },
};

const SAMPLE_NOTES = [
  { id: "n1", title: "Inference benchmark review", hoursAgo: 120, items: ["sram", "groq"],
    text: "The on-chip SRAM design showed lower latency in the tested inference workload. The results cover a fixed 70B model size and don't establish performance across workloads.",
    views: [{ item: "sram", stance: "support", view: "SRAM designs lead on single-model latency.", quote: "The on-chip SRAM design showed lower latency in the tested inference workload." },
            { item: "groq", stance: "support", view: "Groq's latency advantage holds on 70B inference.", quote: "Results cover a fixed 70B model size." }] },
  { id: "n2", title: "Groq architecture notes", hoursAgo: 96, items: ["groq"],
    text: "Management points to gross margin above 65% at scale, driven by lower memory cost per token. No first-party packaging cost target was given.",
    views: [{ item: "groq", stance: "routine", view: "Gross margin will exceed 65% at scale.", quote: "Management points to gross margin above 65% at scale.", baseline: true }] },
  { id: "n3", title: "Channel check, CoWoS", hoursAgo: 26, items: ["cowos"],
    text: "Two packaging suppliers say 2027 CoWoS allocation was raised for inference customers. Lead times are unchanged.",
    views: [{ item: "cowos", stance: "support", view: "2027 CoWoS allocation is rising.", quote: "2027 CoWoS allocation was raised for inference customers." }] },
  { id: "n4", title: "Cerebras briefing", hoursAgo: 5, items: ["cerebras", "sram"],
    text: "WSE-3 beat GPU latency on 70B inference in the customer pilot. The pilot used one model and batch size.",
    views: [{ item: "cerebras", stance: "support", view: "WSE-3 leads GPUs on 70B latency.", quote: "WSE-3 beat GPU latency on 70B inference in the customer pilot." },
            { item: "sram", stance: "routine", view: "A second SRAM-heavy design shows the same latency pattern.", quote: "The pilot used one model and batch size." }] },
  { id: "n5", title: "Supplier call, TSMC", hoursAgo: 2, items: ["groq", "cowos"],
    text: "Interposer costs could take Groq's gross margin to about 52% through the next production cycle. Customers are asking about later delivery dates, but there's no confirmed change to the rollout.",
    views: [{ item: "groq", stance: "challenge", view: "Gross margin could fall to about 52% on interposer costs.", quote: "Interposer costs could take Groq's gross margin to about 52%.", against: "Gross margin will exceed 65% at scale." },
            { item: "cowos", stance: "routine", view: "Customers are asking about later delivery dates.", quote: "Customers are asking about later delivery dates, but there's no confirmed change to the rollout." }] },
];

const SAMPLE_TEXT = "A supplier says advanced packaging costs for Groq's SRAM-heavy accelerators may stay elevated through the next production cycle. Latency in the latest inference tests remains strong.";

let state;
let history = [];
let current = { screen: "recent" };
const chats = {};
let chatKey = null;
let toastTimer;

const $ = selector => document.querySelector(selector);
const screen = $("#screen");
const esc = value => String(value).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));

function load(empty) {
  const now = Date.now();
  state = { notes: {}, items: {}, views: [] };
  if (!empty) SAMPLE_NOTES.forEach(note => ingest({ ...note, at: now - note.hoursAgo * 3600e3, status: "processed" }, note.views));
  history = [];
  current = { screen: "recent" };
  Object.keys(chats).forEach(key => delete chats[key]);
  render();
}

function ingest(note, views) {
  state.notes[note.id] = note;
  note.items.forEach(id => { if (!state.items[id]) state.items[id] = { id, ...CATALOG[id] }; });
  views.forEach(view => state.views.push({ ...view, note: note.id, at: note.at }));
}

function ago(at) {
  const minutes = Math.max(0, Math.round((Date.now() - at) / 60e3));
  if (minutes < 1) return "now";
  if (minutes < 60) return minutes + "m";
  const hours = Math.round(minutes / 60);
  return hours < 24 ? hours + "h" : Math.round(hours / 24) + "d";
}

const since = at => { const value = ago(at); return value === "now" ? "just now" : value + " ago"; };
const viewsFor = id => state.views.filter(view => view.item === id).sort((a, b) => b.at - a.at);
const notesFor = id => Object.values(state.notes).filter(note => note.items.includes(id)).sort((a, b) => b.at - a.at);
const stanceWord = { challenge: "Challenges a view", support: "Supports", routine: "Adds" };

function quoteBlock(view, withStance) {
  const note = state.notes[view.note];
  return `${withStance ? `<p class="stance ${view.stance}">${stanceWord[view.stance]}</p>` : ""}
    <blockquote class="quote ${view.stance}">“${esc(view.quote)}”</blockquote>
    <button class="cite link" data-go="note" data-id="${note.id}">${esc(note.title)}, ${since(note.at)}</button>`;
}

function renderRecent() {
  const pending = Object.values(state.notes).filter(note => note.status !== "processed");
  const items = Object.values(state.items).map(item => ({ item, latest: viewsFor(item.id)[0] }))
    .filter(entry => entry.latest).sort((a, b) => b.latest.at - a.latest.at);
  if (!items.length && !pending.length) {
    return `<h1>Recent</h1>
      <div class="empty"><h2 style="border:0;font-size:var(--size-heading);font-weight:500;margin:0">Capture your first note</h2>
      <p>Write or paste what you heard. Companies and themes from the note show up here once it's processed.</p>
      <button class="primary" data-action="capture">New note</button></div>
      <p class="proto">Prototype. <button class="link" data-action="sample">Load sample research</button></p>`;
  }
  const pendingRows = pending.map(note => `<button class="row" data-go="note" data-id="${note.id}">
      <div class="row-head"><span class="row-name">${esc(note.title)}</span><span class="status ${note.status}">${note.status === "queued" ? "Queued" : "Processing"}</span></div></button>`).join("");
  const rows = items.map(({ item, latest }) => `<div class="row">
      <div class="row-head"><button class="link row-name" style="text-decoration:none" data-go="item" data-id="${item.id}">${esc(item.name)}<span class="kind">${item.kind}</span></button><span class="when">${ago(latest.at)}</span></div>
      ${quoteBlock(latest, false)}</div>`).join("");
  return `<h1>Recent</h1>
    ${pending.length ? `<h2>Processing</h2>${pendingRows}` : ""}
    ${items.length ? `<h2>Changed</h2>${rows}` : ""}
    <p class="proto">Prototype. <button class="link" data-action="empty">Start empty</button> · <button class="link" data-action="sample">Reload sample</button></p>`;
}

function renderItem(id) {
  const item = state.items[id];
  const views = viewsFor(id);
  const challenged = views.filter(view => view.against);
  const rest = views.filter(view => !view.against && !challenged.some(c => c.against === view.view));
  const pairs = challenged.map(view => {
    const base = views.find(other => other.view === view.against);
    return `<div class="pair">
      <p class="view-text">${esc(view.view)}</p>${quoteBlock(view, true)}
      ${base ? `<p class="pair-label">Disagrees with</p><p class="view-text" style="margin-top:4px">${esc(base.view)}</p>${quoteBlock(base, false)}` : ""}
      <div class="actions"><button class="secondary" data-action="chat" data-ask="Which is more likely, ${esc(view.view.toLowerCase().replace(/\.$/, ""))} or ${esc((base ? base.view : "the prior view").toLowerCase().replace(/\.$/, ""))}?">Ask which holds</button></div></div>`;
  }).join("");
  const list = rest.map(view => `<div class="row" style="cursor:default"><div class="row-head"><span class="row-name" style="font-weight:400">${esc(view.view)}</span><span class="when">${ago(view.at)}</span></div>${quoteBlock(view, true)}</div>`).join("");
  const sources = notesFor(id).map(note => `<button class="row" data-go="note" data-id="${note.id}"><div class="row-head"><span class="row-name" style="font-weight:400">${esc(note.title)}</span><span class="when">${ago(note.at)}</span></div></button>`).join("");
  return `<p class="kind">${item.kind}</p><h1>${esc(item.name)}</h1>
    <h2>Consensus</h2><p class="lede" style="font-family:var(--font-source);line-height:1.55">${esc(item.consensus)}</p>
    ${pairs ? `<h2>Disagreement</h2>${pairs}` : ""}
    ${list ? `<h2>Views and events</h2>${list}` : ""}
    <h2 id="sources">Sources</h2>${sources}`;
}

function renderNote(id) {
  const note = state.notes[id];
  const done = note.status === "processed";
  const linked = note.items.filter(item => state.items[item]).map(item => `<button class="row" data-go="item" data-id="${item}"><span class="row-name">${esc(state.items[item].name)}<span class="kind">${state.items[item].kind}</span></span></button>`).join("");
  const status = done ? `<span class="status">Processed ${since(note.at)}</span>` : `<span class="status ${note.status}">${note.status === "queued" ? "Queued for processing" : "Processing"}</span>`;
  return `<p class="kind">note</p><h1>${esc(note.title)}</h1>${status}
    <p class="source-text">${esc(note.text)}</p>
    ${done ? `<h2>Extracted</h2>${linked || '<p class="meta">No companies or themes found in this note.</p>'}
      <div class="actions"><button class="secondary" data-action="chat">Research this note</button></div>` : ""}`;
}

function renderSearch() {
  return `<h1>Search</h1><input class="search" id="search-input" type="search" placeholder="Groq, packaging, margin" aria-label="Search" value="${esc(current.query || "")}"><div id="results">${searchResults(current.query || "")}</div>`;
}

function searchResults(query) {
  const q = query.trim().toLowerCase();
  if (!q) return `<p class="meta" style="margin-top:16px">Search companies, themes, and notes.</p>`;
  const items = Object.values(state.items).filter(item => (item.name + " " + item.consensus).toLowerCase().includes(q));
  const notes = Object.values(state.notes).filter(note => (note.title + " " + note.text).toLowerCase().includes(q));
  if (!items.length && !notes.length) return `<p class="meta" style="margin-top:16px">Nothing matches “${esc(query)}”. Try a company or theme name.</p>`;
  return `${items.length ? `<h2>Companies and themes</h2>${items.map(item => `<button class="row" data-go="item" data-id="${item.id}"><span class="row-name">${esc(item.name)}<span class="kind">${item.kind}</span></span></button>`).join("")}` : ""}
    ${notes.length ? `<h2>Notes</h2>${notes.map(note => `<button class="row" data-go="note" data-id="${note.id}"><div class="row-head"><span class="row-name" style="font-weight:400">${esc(note.title)}</span><span class="when">${ago(note.at)}</span></div></button>`).join("")}` : ""}`;
}

function render(focus) {
  const views = { recent: renderRecent, item: () => renderItem(current.id), note: () => renderNote(current.id), search: renderSearch };
  screen.innerHTML = views[current.screen]();
  $("#back").hidden = history.length === 0;
  if (history.length) $("#back").textContent = "Back to " + label(history.at(-1));
  $("#chat-open").hidden = current.screen !== "item";
  $("#nav-recent").toggleAttribute("aria-current", current.screen === "recent");
  $("#nav-search").toggleAttribute("aria-current", current.screen === "search");
  if (current.screen === "recent") $("#nav-recent").setAttribute("aria-current", "page");
  if (current.screen === "search") {
    $("#nav-search").setAttribute("aria-current", "page");
    const input = $("#search-input");
    input.addEventListener("input", () => { current.query = input.value; $("#results").innerHTML = searchResults(input.value); });
    if (focus) input.focus();
  } else if (focus) screen.focus();
}

function label(entry) {
  if (entry.screen === "item") return state.items[entry.id].name;
  if (entry.screen === "note") return "note";
  return entry.screen === "search" ? "Search" : "Recent";
}

function go(screenName, id) {
  if (current.screen === screenName && current.id === id) return;
  history.push(current);
  current = { screen: screenName, id };
  render(true);
  window.scrollTo(0, 0);
}

function root(screenName) {
  history = [];
  current = { screen: screenName, query: screenName === "search" ? current.query : undefined };
  render(true);
  window.scrollTo(0, 0);
}

function toast(message) {
  const el = $("#toast");
  el.textContent = message;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
}

let captureHint = null;
let captureSummary = null;
function openCapture(prefill) {
  captureHint = current.screen === "item" ? current.id : null;
  $("#capture-hint").innerHTML = captureHint ? `<span class="hint">For ${esc(state.items[captureHint].name)}<button type="button" aria-label="Remove hint" id="hint-remove">×</button></span>` : "";
  captureSummary = prefill ? prefill.summary : null;
  $("#capture-name").value = prefill ? prefill.title : "";
  $("#capture-text").value = prefill ? prefill.text : "";
  $("#capture-title").textContent = prefill ? "Save as note" : "New note";
  $("#capture-error").textContent = "";
  $("#capture").showModal();
  $("#capture-text").focus();
}

function stanceOf(text) {
  if (/cost|delay|later|premium|elevated|lower margin|risk|cut/i.test(text)) return "challenge";
  if (/raised|strong|beat|ahead|lead|confirm/i.test(text)) return "support";
  return "routine";
}

function submitCapture(event) {
  event.preventDefault();
  const text = $("#capture-text").value.trim();
  if (!text) { $("#capture-error").textContent = "Write or paste the note first."; return; }
  const title = $("#capture-name").value.trim() || text.split(/[.!?]/)[0].slice(0, 48);
  const id = "c" + Date.now();
  const note = { id, title, text, at: Date.now(), status: "queued", items: [], hint: captureHint, summary: captureSummary };
  state.notes[id] = note;
  $("#capture").close();
  toast("Saved. Queued for processing.");
  render();
  setTimeout(() => { note.status = "processing"; render(); }, 1500);
  setTimeout(() => finishProcessing(note), 4500);
}

function finishProcessing(note) {
  const found = Object.keys(CATALOG).filter(key => CATALOG[key].match.test(note.text));
  if (note.hint && !found.includes(note.hint)) found.unshift(note.hint);
  const sentence = note.summary || note.text.split(/(?<=[.!?])\s+/)[0];
  note.status = "processed";
  note.at = Date.now();
  note.items = found;
  ingest(note, found.map(item => ({ item, stance: stanceOf(note.text), view: sentence, quote: sentence })));
  render();
  toast(found.length ? `Processed. Updated ${found.map(key => CATALOG[key].name).join(", ")}.` : "Processed. No companies or themes found.");
}

function contextFor() {
  if (current.screen === "item") return { key: "item:" + current.id, name: state.items[current.id].name, notes: notesFor(current.id) };
  if (current.screen === "note") return { key: "note:" + current.id, name: state.notes[current.id].title, notes: [state.notes[current.id]] };
  return null;
}

function openChat(ask) {
  const context = contextFor();
  if (!context) return;
  chatKey = context.key;
  if (!chats[chatKey]) chats[chatKey] = { context, messages: [] };
  chats[chatKey].context = context;
  $("#chat-title").textContent = "About " + context.name;
  drawChat();
  $("#chat").showModal();
  if (ask) send(ask); else $("#chat-input").focus();
}

function drawChat() {
  const chat = chats[chatKey];
  $("#chat-log").innerHTML = chat.messages.length ? chat.messages.map((message, index) => message.from === "you"
    ? `<div class="msg you"><span>${esc(message.text)}</span></div>`
    : message.pending ? `<p class="thinking">Reading the notes…</p>`
    : `<div class="msg agent">${message.html}<div class="actions"><button class="secondary" data-save="${index}">Save as note</button></div></div>`).join("")
    : `<p class="meta">Ask about ${esc(chat.context.name)}. Answers cite the notes they use.</p>`;
  const log = $("#chat-log");
  log.scrollTop = log.scrollHeight;
}

function reply(context, question) {
  const refute = /refute|against|wrong|risk/i.test(question);
  const cited = context.notes.slice(0, 3);
  const lead = refute
    ? `These notes cut against the current view of ${esc(context.name)}:`
    : /timing|rollout|delivery/i.test(question)
      ? `Here's what the notes say about timing for ${esc(context.name)}:`
      : `Here's what the notes say about ${esc(context.name)}:`;
  const pick = note => { const parts = note.text.split(/(?<=[.!?])\s+/); return refute ? parts.at(-1) : parts[0]; };
  const quotes = cited.map((note, i) => `<blockquote class="quote ${stanceOf(note.text)}">“${esc(pick(note))}”</blockquote>
    <button class="cite link" data-go="note" data-id="${note.id}">[${i + 1}] ${esc(note.title)}</button>`).join("");
  const close = refute || /which|likely|margin|hold/i.test(question)
    ? "The 52% figure rests on one supplier call. A second quote on interposer pricing, or a margin figure from the next earnings call, would settle it."
    : /timing|rollout|delivery/i.test(question)
      ? "None of these notes confirms a change to the rollout. A dated customer order would."
      : "These notes agree on the latency lead. Cost is the open question.";
  const plain = `${lead.replace(/&#39;/g, "'")}\n\n${cited.map((note, i) => `"${pick(note)}" [${i + 1}]`).join("\n")}\n\n${close}\n\n${cited.map((note, i) => `[${i + 1}] ${note.title}`).join("\n")}`;
  return { html: `<p>${lead}</p>${quotes}<p style="margin-top:10px">${close}</p>`, plain, title: `Chat on ${context.name}`, summary: close.split(/(?<=[.!?])\s+/)[0] };
}

function send(text) {
  const chat = chats[chatKey];
  chat.messages.push({ from: "you", text });
  chat.messages.push({ from: "agent", pending: true });
  drawChat();
  setTimeout(() => {
    chat.messages.pop();
    chat.messages.push({ from: "agent", ...reply(chat.context, text) });
    drawChat();
  }, 900);
}

document.addEventListener("click", event => {
  const target = event.target.closest("[data-go],[data-action],[data-save],[data-ask]");
  if (!target) return;
  if (target.dataset.go) {
    if ($("#chat").open) $("#chat").close();
    go(target.dataset.go, target.dataset.id);
  } else if (target.dataset.save) {
    const message = chats[chatKey].messages[Number(target.dataset.save)];
    $("#chat").close();
    openCapture({ title: message.title, text: message.plain, summary: message.summary });
  } else if (target.dataset.action === "capture") openCapture();
  else if (target.dataset.action === "chat") openChat(target.dataset.ask);
  else if (target.dataset.action === "empty") load(true);
  else if (target.dataset.action === "sample") load(false);
  else if (target.dataset.ask && $("#chat").open) send(target.dataset.ask);
});

$("#back").addEventListener("click", () => { current = history.pop(); render(true); });
$("#nav-recent").addEventListener("click", () => root("recent"));
$("#nav-search").addEventListener("click", () => root("search"));
$("#nav-capture").addEventListener("click", () => openCapture());
$("#chat-open").addEventListener("click", () => openChat());
$("#chat-close").addEventListener("click", () => $("#chat").close());
$("#capture-cancel").addEventListener("click", () => $("#capture").close());
$("#capture-form").addEventListener("submit", submitCapture);
$("#capture-sample").addEventListener("click", () => { $("#capture-text").value = SAMPLE_TEXT; $("#capture-name").value = "Supplier call, packaging"; $("#capture-error").textContent = ""; });
$("#capture-text").addEventListener("input", () => { $("#capture-error").textContent = ""; });
$("#capture-hint").addEventListener("click", event => { if (event.target.id === "hint-remove") { captureHint = null; $("#capture-hint").innerHTML = ""; } });
$("#chat-form").addEventListener("submit", event => {
  event.preventDefault();
  const input = $("#chat-input");
  if (input.value.trim()) { send(input.value.trim()); input.value = ""; }
});
setInterval(() => { if (!$("#capture").open && current.screen !== "search") render(); }, 60e3);

load(false);
</script>
</body>
</html>
